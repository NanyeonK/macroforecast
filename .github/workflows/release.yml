name: release

# PyPI publish via Trusted Publishing (OIDC) -- no long-lived token.
# Triggered manually via GitHub Actions "Run workflow" UI.
# User must type the version string with a leading "v" (e.g. v0.9.5)
# before triggering; the workflow validates it against pyproject.toml.
# tag push alone no longer publishes to PyPI.
#
# NOTE: the project maintainer owns the ``macroforecast`` PyPI namespace,
# and release publishing is handled by this manual workflow at
# https://pypi.org/project/macroforecast/. v0.6.0 was the first release
# under this namespace; v0.5.x tags pre-date the rename and were never
# published to PyPI.
#
# Required, and required IN THIS ORDER -- merging this before the PyPI side
# exists turns the next release into a failed job:
#   1. PyPI → macroforecast → Publishing → add a trusted publisher:
#      owner NanyeonK, repo macroforecast, workflow release.yml,
#      environment pypi
#   2. GitHub → Settings → Environments → create "pypi"; a required
#      reviewer here makes publishing need an explicit human approval,
#      which the token flow never had
#   3. publish one release and confirm it lands
#   4. THEN revoke PYPI_API_TOKEN on PyPI and delete the repo secret
#
# Step 4 is the point of the exercise and the easiest to skip: an
# un-revoked token leaves the old blast radius intact while looking as if
# it were closed. Rationale and rollback: .dev-notes/trusted_publishing.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; vX.Y.Z or vX.Y.Z{a|b|rc}N, must match pyproject.toml (e.g. v0.9.5, v0.9.6b1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Validate release version input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          release_version = os.environ["RELEASE_VERSION"].strip()
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?", release_version):
              sys.exit(
                  "release version must be vX.Y.Z or a vX.Y.Z{a|b|rc}N pre-release "
                  f"(got {release_version!r})"
              )

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package_version = project["project"]["version"]
          expected = f"v{package_version}"
          if release_version != expected:
              sys.exit(
                  "release version must match pyproject.toml: "
                  f"input={release_version!r}, expected={expected!r}"
              )

          print(f"release version OK: {release_version}")
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC). GitHub mints a short-lived token for THIS
    # repository, THIS workflow and THIS environment at publish time; PyPI
    # verifies the claim. Nothing long-lived exists to leak, and the release
    # carries a verifiable statement of which workflow built it.
    #
    # The environment is a gate as well as a claim: a required reviewer on
    # "pypi" makes publishing need an explicit human approval, which the token
    # flow never had.
    environment: pypi
    permissions:
      # Scoped to this job only. The top-level permissions block stays
      # contents: read, so no other job gains anything from this.
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
